name: Coletar Dados Dashboard Marketing

on:
  schedule:
    - cron: '30 10 * * *'  # 07:30 BRT (UTC-3) — manhã
    - cron: '30 16 * * *'  # 13:30 BRT — pós-almoço
    - cron: '0 19 * * *'   # 16:00 BRT — meio da tarde
  workflow_dispatch:

jobs:
  coletar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Criar arquivo .env
        run: |
          cat > .env << 'EOF'
          SPRINTHUB_API_TOKEN=${{ secrets.SPRINTHUB_API_TOKEN }}
          SPRINTHUB_INSTANCE=${{ secrets.SPRINTHUB_INSTANCE }}
          SPRINTHUB_STAGE_MAP=${{ secrets.SPRINTHUB_STAGE_MAP }}
          GOOGLE_SHEET_ID=${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_ADS_DEVELOPER_TOKEN=${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID=${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET=${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN=${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_CUSTOMER_ID=${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}
          EOF

      - name: Validar credenciais Supabase
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_SERVICE_KEY }}" ]; then
            echo "::error::Secrets SUPABASE_URL ou SUPABASE_SERVICE_KEY nao configurados! Pipeline ABORTADO — os dados nao serao expostos."
            exit 1
          fi
          echo "OK: credenciais Supabase definidas."

      - name: Criar credenciais Google
        run: |
          mkdir -p credentials
          echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials/google_service_account.json
          echo '${{ secrets.GA4_TOKEN_JSON }}' > credentials/ga4_token.json

      - name: Executar coleta de dados
        run: python -u main.py
        timeout-minutes: 60

      - name: Gerar dados do dashboard (gera summary.json e faz upload pro Supabase)
        run: |
          mkdir -p dashboard/data
          python -u scripts/generate_dashboard_data.py
        timeout-minutes: 10

